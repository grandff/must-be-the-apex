<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Must Be The Apex - Overlay HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fullscreen Edge Glow Flash Overlay for Apex Speed Feedback -->
  <div id="flash-screen" class="apex-flash-screen"></div>

  <!-- In-Game HUD Elements (Click-Through overlays) -->
  <div id="overlay-hud">
    <!-- Brake Timing HUD -->
    <div id="brake-hud" class="hud-panel hidden">
      <div class="hud-title">BRAKE TIMING</div>
      <div class="brake-visual">
        <span class="scale-label early">EARLY</span>
        <div class="brake-track">
          <div class="brake-center-line"></div>
          <div id="brake-indicator" class="brake-indicator-dot"></div>
        </div>
        <span class="scale-label late">LATE</span>
      </div>
      <div id="brake-feedback-badge" class="feedback-badge perfect">PERFECT</div>
      <div id="brake-details" class="feedback-details">0.0m</div>
    </div>

    <!-- Apex Speed HUD -->
    <div id="apex-hud" class="hud-panel apex-hud hidden">
      <div class="hud-title">APEX SPEED</div>
      <div id="apex-feedback-badge" class="feedback-badge perfect">PERFECT</div>
      <div id="apex-details" class="feedback-details">+0.0 km/h</div>
    </div>

    <!-- Reference Data Warning HUD -->
    <div id="warning-hud" class="hud-panel warning-hud hidden">
      <span class="warning-icon">⚠️</span>
      <div class="warning-text">REFERENCE TELEMETRY MISSING (CRAWL REQUIRED)</div>
    </div>
  </div>

  <!-- Desktop Control Panel (Hidden when connected/playing to not block game) -->
  <div id="control-panel" class="control-panel">
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">🏎️</span>
        <h1>MUST BE THE APEX</h1>
      </div>
      
      <div id="connection-banner" class="status-banner disconnected">
        <span class="status-indicator"></span>
        <span id="connection-text">DISCONNECTED</span>
      </div>
    </header>

    <main class="main-panel">
      <!-- Recording Status Indicator -->
      <div class="recording-status-box">
        <span id="recording-indicator" class="recording-dot"></span>
        <span id="recording-text">iRacing 연결 대기 중...</span>
      </div>

      <!-- Session Info Banner -->
      <div class="session-info-bar">
        <span class="info-label">TRACK:</span> <span id="info-track" class="info-value">-</span>
        <span class="info-divider">|</span>
        <span class="info-label">CAR:</span> <span id="info-car" class="info-value">-</span>
      </div>

      <!-- Download Panel -->
      <div class="download-section">
        <div class="download-header">
          <h3>Saved Telemetry Logs</h3>
          <button id="btn-clear" class="btn-clear">Clear All</button>
        </div>

        <div id="laps-container" class="laps-container">
          <div class="no-laps-message">기록된 랩 데이터가 없습니다. 트랙 주행을 시작하세요.</div>
        </div>
      </div>

      <!-- Notification Toast -->
      <div id="toast" class="toast hidden"></div>
    </main>
  </div>

  <script src="ui-controller.js"></script>
</body>
</html>
