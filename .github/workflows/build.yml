name: Build Electron App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies (ignore scripts)
        run: npm ci --ignore-scripts

      - name: Strip UTF-8 BOM from node-irsdk binding.gyp
        run: node -e "const fs = require('fs'); const file = 'node_modules/node-irsdk/binding.gyp'; if (fs.existsSync(file)) { let content = fs.readFileSync(file, 'utf8'); if (content.startsWith('\ufeff')) { fs.writeFileSync(file, content.replace(/^\ufeff/, ''), 'utf8'); console.log('BOM stripped successfully.'); } }"

      - name: Rebuild Native Modules
        run: npm rebuild

      - name: Build and Package Electron App
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
